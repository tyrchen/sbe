name: build

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    # services:
    #   postgres:
    #     image: postgres:14.5
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #     ports:
    #       - 5432:5432
    #     # Set health checks to wait until postgres has started
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@d630c3ba8c9bb0648bcefda869fb0d9b98c611d9 # cargo-llvm-cov
      - name: install nextest
        uses: taiki-e/install-action@b2876a75f58e1551c204bbfe1b56c63dabd6fcb0 # nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # - name: Install Protoc
      #   uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0

      # Build the exact checked-out source with the locked dependency graph,
      # then dogfood that binary. This avoids trusting an older downloaded SBE
      # release that predates checksum and attestation verification. nextest
      # stays outside because its proxy tests bind random localhost TCP ports.
      - name: Build current sbe (dogfood)
        run: cargo install --path apps/cli --locked --force
      - name: sbe smoke
        run: |
          sbe --version
          sbe profiles >/dev/null

      - name: Check code format
        run: cargo fmt --all -- --check
      - name: Check the package for errors
        run: sbe run --allow-insecure-linux-network -- cargo check --all
      - name: Lint rust sources
        run: sbe run --allow-insecure-linux-network -- cargo clippy --all-targets --all-features --tests --benches -- -D warnings
      - name: Execute rust tests
        run: cargo nextest run --all-features

  security:
    name: dependency and workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install security tools
        uses: taiki-e/install-action@d630c3ba8c9bb0648bcefda869fb0d9b98c611d9
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.19.8,cargo-machete@0.9.2
      - name: Check workflow security invariants
        run: ruby .github/scripts/check-workflow-security.rb
      - name: Scan RustSec advisories
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Check unused dependencies
        run: cargo machete
