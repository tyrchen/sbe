name: release-cli

on:
  push:
    tags:
      - 'sbexec-v*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag and manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source and version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sbexec") | .version')
          test "$GITHUB_REF_NAME" = "sbexec-v$version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match sbexec $version"
            exit 1
          }

  create-release:
    name: Create GitHub release
    needs: verify-tag
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: true

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries, run on Ubuntu.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          # macOS: dynamic-linked darwin binary on Apple Silicon.
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # Bootstrap future releases with the latest audited SBE release. The
      # setup action verifies both checksum and build provenance. On native
      # targets the sandboxed build warms the upload action's cache;
      # cross-musl targets use a host-native sandboxed check.
      - name: Install sbe 0.4.2 (dogfood)
        uses: tyrchen/sbe@dba413595698f878a07c2106b45bf7b115ad1bea # sbexec-v0.4.2
        with:
          version: '0.4.2'
      - name: Pre-build under sbe (dogfood)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            aarch64-apple-darwin)
              rustup target add "$TARGET"
              sbe run -- \
                cargo build --release --locked --target "$TARGET" \
                --manifest-path apps/cli/Cargo.toml
              ;;
            *)
              # x86_64/aarch64 musl on ubuntu need a musl/cross linker that
              # upload-rust-binary-action provisions internally — avoid
              # duplicating that here. A host-native `cargo check` still
              # gives us a real sbe workload to dogfood against.
              sbe run -- cargo check --locked \
                --manifest-path apps/cli/Cargo.toml
              ;;
          esac

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbe-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build and upload binary to release
        id: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: sbe
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: all
          zip: none
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/${{ github.ref_name }}
          manifest_path: apps/cli/Cargo.toml
          locked: true
          checksum: sha256
          include: LICENSE.md,README.md,sbe-${{ matrix.target }}.spdx.json

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.upload.outputs.tar }}

  publish-release:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish draft after every target succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
